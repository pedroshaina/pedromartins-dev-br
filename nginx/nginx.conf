worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format json escape=json '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"user_agent":"$http_user_agent"'
  '}';
  access_log /dev/stdout json;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json application/xml application/rss+xml image/svg+xml text/plain text/xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Behind the Gateway the public host and port differ from nginx's: keep redirects relative.
    absolute_redirect off;

    # add_header in a location replaces the server's, so every location includes the set.
    set $csp "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'";

    error_page 404 /404.html;

    location = /health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /ready {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location /_astro/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header Content-Security-Policy $csp always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /pt-br/ {
      error_page 404 /pt-br/404/index.html;
      try_files $uri $uri/ =404;
      add_header Cache-Control "no-cache" always;
      add_header Content-Security-Policy $csp always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
      try_files $uri $uri/ =404;
      add_header Cache-Control "no-cache" always;
      add_header Content-Security-Policy $csp always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
  }
}
