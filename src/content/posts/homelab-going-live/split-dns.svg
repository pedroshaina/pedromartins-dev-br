<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t">
  <title id="t">Split DNS: external-dns writes every route to the internal DNS server, and only public apps to Cloudflare</title>
  <style>
    text { font-family: 'IBM Plex Sans', system-ui, sans-serif; fill: #9aa1ba; font-size: 15px; }
    .h { fill: #ffffff; font-weight: 600; font-size: 17px; }
    .m { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; }
    .c { fill: #05d9e8; }
    .g { fill: #ff2a6d; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#05d9e8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#ff2a6d"/>
    </marker>
  </defs>
  <rect width="720" height="380" rx="8" fill="#0a1128"/>

  <rect x="210" y="20" width="300" height="62" rx="6" fill="none" stroke="#70789a" stroke-width="1.5"/>
  <text x="230" y="46" class="h">routes in the cluster</text>
  <text x="230" y="68" class="m">HTTPRoutes + the app registry</text>

  <path d="M300 82 L170 150" stroke="#05d9e8" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M420 82 L550 150" stroke="#ff2a6d" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="70" y="118" class="m c">external-dns · every route</text>
  <text x="500" y="118" class="m g">external-dns-public</text>
  <text x="500" y="136" class="m g">public apps only</text>

  <rect x="20" y="154" width="320" height="90" rx="6" fill="none" stroke="#05d9e8" stroke-width="1.5"/>
  <text x="40" y="180" class="h c">dns01 · Technitium</text>
  <text x="40" y="204">internal zone, LAN only</text>
  <text x="40" y="226" class="m">grafana · argocd · apps</text>

  <rect x="380" y="154" width="320" height="90" rx="6" fill="none" stroke="#ff2a6d" stroke-width="1.5"/>
  <text x="400" y="180" class="h g">Cloudflare DNS</text>
  <text x="400" y="204">public zone</text>
  <text x="400" y="226" class="m">public apps → tunnel</text>

  <path d="M180 284v-36" stroke="#05d9e8" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M540 284v-36" stroke="#ff2a6d" stroke-width="1.5" marker-end="url(#b)"/>

  <rect x="20" y="288" width="320" height="70" rx="6" fill="none" stroke="#70789a" stroke-width="1.5"/>
  <text x="40" y="314" class="h">my laptop, at home</text>
  <text x="40" y="338">sees internal and public names</text>

  <rect x="380" y="288" width="320" height="70" rx="6" fill="none" stroke="#70789a" stroke-width="1.5"/>
  <text x="400" y="314" class="h">anyone on the internet</text>
  <text x="400" y="338">sees public apps only</text>
</svg>
