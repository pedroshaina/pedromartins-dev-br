<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t">
  <title id="t">Split DNS: o external-dns publica todas as rotas no DNS interno, e só as das aplicações públicas na Cloudflare</title>
  <style>
    text { font-family: 'IBM Plex Sans', system-ui, sans-serif; fill: #9aa1ba; font-size: 15px; }
    .h { fill: #ffffff; font-weight: 600; font-size: 17px; }
    .m { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; }
    .c { fill: #05d9e8; }
    .g { fill: #ff2a6d; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#05d9e8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#ff2a6d"/>
    </marker>
  </defs>
  <rect width="720" height="380" rx="8" fill="#0a1128"/>

  <rect x="210" y="20" width="300" height="62" rx="6" fill="none" stroke="#70789a" stroke-width="1.5"/>
  <text x="230" y="46" class="h">rotas no cluster</text>
  <text x="230" y="68" class="m">HTTPRoutes + o app registry</text>

  <path d="M300 82 L170 150" stroke="#05d9e8" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M420 82 L550 150" stroke="#ff2a6d" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="70" y="112" class="m c">external-dns</text>
  <text x="70" y="130" class="m c">todas as rotas</text>
  <text x="515" y="118" class="m g">external-dns-public</text>
  <text x="515" y="136" class="m g">só aplicações públicas</text>

  <rect x="20" y="154" width="320" height="90" rx="6" fill="none" stroke="#05d9e8" stroke-width="1.5"/>
  <text x="40" y="180" class="h c">dns01 · Technitium</text>
  <text x="40" y="204">zona interna, só na rede local</text>
  <text x="40" y="226" class="m">grafana · argocd · aplicações</text>

  <rect x="380" y="154" width="320" height="90" rx="6" fill="none" stroke="#ff2a6d" stroke-width="1.5"/>
  <text x="400" y="180" class="h g">DNS da Cloudflare</text>
  <text x="400" y="204">zona pública</text>
  <text x="400" y="226" class="m">aplicações públicas → túnel</text>

  <path d="M180 284v-36" stroke="#05d9e8" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M540 284v-36" stroke="#ff2a6d" stroke-width="1.5" marker-end="url(#b)"/>

  <rect x="20" y="288" width="320" height="70" rx="6" fill="none" stroke="#70789a" stroke-width="1.5"/>
  <text x="40" y="314" class="h">meu notebook, em casa</text>
  <text x="40" y="338">vê nomes internos e públicos</text>

  <rect x="380" y="288" width="320" height="70" rx="6" fill="none" stroke="#70789a" stroke-width="1.5"/>
  <text x="400" y="314" class="h">qualquer um na internet</text>
  <text x="400" y="338">só vê as aplicações públicas</text>
</svg>
