<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="t">
  <title id="t">Uma requisição pública: o edge da Cloudflare faz a terminação TLS e manda a requisição por um túnel de saída até o cloudflared, que repassa para o Gateway e para a aplicação</title>
  <style>
    text { font-family: 'IBM Plex Sans', system-ui, sans-serif; fill: #9aa1ba; font-size: 15px; }
    .h { fill: #ffffff; font-weight: 600; font-size: 17px; }
    .m { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; }
    .c { fill: #05d9e8; }
    .g { fill: #ff2a6d; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#05d9e8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#ff2a6d"/>
    </marker>
  </defs>
  <rect width="720" height="560" rx="8" fill="#0a1128"/>

  <rect x="40" y="20" width="400" height="56" rx="6" fill="none" stroke="#70789a" stroke-width="1.5"/>
  <text x="60" y="44" class="h">visitante</text>
  <text x="60" y="64" class="m">https://yabe.pdrlabs.com.br</text>
  <path d="M240 76v30" stroke="#05d9e8" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="110" width="400" height="76" rx="6" fill="none" stroke="#ff2a6d" stroke-width="1.5"/>
  <text x="60" y="136" class="h g">edge da Cloudflare</text>
  <text x="60" y="158">DNS público: um CNAME para o túnel</text>
  <text x="60" y="178">o TLS do visitante termina aqui</text>

  <!-- home -->
  <rect x="20" y="214" width="680" height="326" rx="6" fill="none" stroke="#05d9e8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="460" y="240" class="c">casa · nenhuma porta aberta</text>

  <path d="M240 290v-100" stroke="#ff2a6d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="256" y="244" class="m g">túnel de saída</text>

  <rect x="40" y="294" width="400" height="60" rx="6" fill="none" stroke="#05d9e8" stroke-width="1.5"/>
  <text x="60" y="320" class="h">cloudflared</text>
  <text x="60" y="342">2 réplicas, conectam na Cloudflare</text>
  <path d="M240 354v30" stroke="#05d9e8" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="388" width="400" height="60" rx="6" fill="none" stroke="#05d9e8" stroke-width="1.5"/>
  <text x="60" y="414" class="h">Gateway compartilhado (Cilium)</text>
  <text x="60" y="436">HTTPS de novo, wildcard do Let's Encrypt</text>
  <path d="M240 448v30" stroke="#05d9e8" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="482" width="400" height="44" rx="6" fill="none" stroke="#05d9e8" stroke-width="1.5"/>
  <text x="60" y="510">HTTPRoute → Service → pods da aplicação</text>

  <text x="460" y="420" class="m">o cert-manager emite</text>
  <text x="460" y="440" class="m">e renova o certificado</text>
  <path d="M456 416h-12" stroke="#70789a" stroke-width="1.5"/>
</svg>
