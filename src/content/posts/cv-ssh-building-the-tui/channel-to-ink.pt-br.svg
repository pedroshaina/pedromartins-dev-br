<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t">
  <title id="t">Uma tecla vai do cliente SSH do visitante pelo canal do ssh2 e pelo terminal de mentira até o Ink, e o frame redesenhado volta pelo mesmo caminho</title>
  <style>
    text { font-family: 'IBM Plex Sans', system-ui, sans-serif; fill: #9aa1ba; font-size: 15px; }
    .h { fill: #ffffff; font-weight: 600; font-size: 17px; }
    .m { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; }
    .c { fill: #05d9e8; }
    .g { fill: #ff2a6d; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#05d9e8"/>
    </marker>
  </defs>
  <rect width="720" height="480" rx="8" fill="#0a1128"/>

  <!-- Visitor -->
  <rect x="100" y="20" width="520" height="64" rx="6" fill="none" stroke="#70789a" stroke-width="1.5"/>
  <text x="120" y="46" class="h">Terminal do visitante</text>
  <text x="120" y="70" class="m">ssh cv.pedromartins.dev.br</text>

  <path d="M200 88v42" stroke="#05d9e8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="212" y="114">teclas</text>
  <path d="M520 130v-42" stroke="#05d9e8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="508" y="114" text-anchor="end">frames</text>

  <!-- Channel -->
  <rect x="100" y="134" width="520" height="64" rx="6" fill="none" stroke="#05d9e8" stroke-width="1.5"/>
  <text x="120" y="160" class="h c">Canal do ssh2</text>
  <text x="120" y="184">bytes nos dois sentidos; o pedido de PTY só manda o tamanho</text>

  <path d="M200 202v42" stroke="#05d9e8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M520 244v-42" stroke="#05d9e8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- Fake terminal -->
  <rect x="100" y="248" width="520" height="96" rx="6" fill="none" stroke="#ff2a6d" stroke-width="1.5"/>
  <text x="120" y="274" class="h g">Terminal de mentira</text>
  <text x="120" y="300" class="m">TerminalInput: isTTY, raw mode não faz nada</text>
  <text x="120" y="324" class="m">TerminalOutput: columns, rows, \n → \r\n</text>

  <path d="M200 348v42" stroke="#05d9e8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M520 390v-42" stroke="#05d9e8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- Ink -->
  <rect x="100" y="394" width="520" height="64" rx="6" fill="none" stroke="#05d9e8" stroke-width="1.5"/>
  <text x="120" y="420" class="h c">Aplicação Ink</text>
  <text x="120" y="444">useInput trata a tecla, o React redesenha</text>
</svg>
