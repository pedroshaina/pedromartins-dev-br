<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="t">
  <title id="t">App of apps: the root Application watches the apps folder, and Argo CD syncs the platform in waves from -2 to 3</title>
  <style>
    text { font-family: 'IBM Plex Sans', system-ui, sans-serif; fill: #9aa1ba; font-size: 15px; }
    .h { fill: #ffffff; font-weight: 600; font-size: 17px; }
    .m { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; }
    .w { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; fill: #060b1d; font-weight: 600; }
    .c { fill: #05d9e8; }
    .g { fill: #ff2a6d; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#05d9e8"/>
    </marker>
  </defs>
  <rect width="720" height="560" rx="8" fill="#0a1128"/>

  <rect x="40" y="20" width="300" height="60" rx="6" fill="none" stroke="#ff2a6d" stroke-width="1.5"/>
  <text x="60" y="46" class="h g">root</text>
  <text x="60" y="68">the only Application applied by hand</text>
  <path d="M190 80v28" stroke="#05d9e8" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="112" width="300" height="44" rx="6" fill="none" stroke="#05d9e8" stroke-width="1.5"/>
  <text x="60" y="140" class="m c">platform-gitops/apps/</text>
  <text x="370" y="140">one Application per component,</text>
  <text x="370" y="162">Argo CD itself included</text>

  <path d="M70 156v370" stroke="#70789a" stroke-width="1.5"/>
  <text x="370" y="196" class="m">synced in order, by sync wave ↓</text>

  <g>
    <path d="M70 236h28" stroke="#70789a" stroke-width="1.5"/>
    <rect x="98" y="220" width="56" height="30" rx="4" fill="#05d9e8"/>
    <text x="126" y="241" class="w" text-anchor="middle">-2</text>
    <text x="172" y="241">AppProjects · Prometheus CRDs</text>
  </g>
  <g>
    <path d="M70 290h28" stroke="#70789a" stroke-width="1.5"/>
    <rect x="98" y="274" width="56" height="30" rx="4" fill="#05d9e8"/>
    <text x="126" y="295" class="w" text-anchor="middle">-1</text>
    <text x="172" y="295">Argo CD · External Secrets · Gateway API CRDs</text>
  </g>
  <g>
    <path d="M70 344h28" stroke="#70789a" stroke-width="1.5"/>
    <rect x="98" y="328" width="56" height="30" rx="4" fill="#05d9e8"/>
    <text x="126" y="349" class="w" text-anchor="middle">0</text>
    <text x="172" y="349">Cilium · cert-manager · secret stores</text>
  </g>
  <g>
    <path d="M70 398h28" stroke="#70789a" stroke-width="1.5"/>
    <rect x="98" y="382" width="56" height="30" rx="4" fill="#05d9e8"/>
    <text x="126" y="403" class="w" text-anchor="middle">1</text>
    <text x="172" y="403">Cilium config · issuers and certificate · metrics-server</text>
  </g>
  <g>
    <path d="M70 452h28" stroke="#70789a" stroke-width="1.5"/>
    <rect x="98" y="436" width="56" height="30" rx="4" fill="#ff2a6d"/>
    <text x="126" y="457" class="w" text-anchor="middle">2</text>
    <text x="172" y="457">Proxmox CSI · external-dns · platform routes</text>
  </g>
  <g>
    <path d="M70 506h28" stroke="#70789a" stroke-width="1.5"/>
    <rect x="98" y="490" width="56" height="30" rx="4" fill="#ff2a6d"/>
    <text x="126" y="511" class="w" text-anchor="middle">3</text>
    <text x="172" y="511">observability · public apps · teams and their apps</text>
  </g>
</svg>
