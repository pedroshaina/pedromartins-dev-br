<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t">
  <title id="t">Fluxo de secrets: um token criptografado com SOPS no Git permite que o External Secrets Operator leia o 1Password e crie Secrets do Kubernetes para as aplicações</title>
  <style>
    text { font-family: 'IBM Plex Sans', system-ui, sans-serif; fill: #9aa1ba; font-size: 15px; }
    .h { fill: #ffffff; font-weight: 600; font-size: 17px; }
    .m { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; }
    .c { fill: #05d9e8; }
    .g { fill: #ff2a6d; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#05d9e8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#ff2a6d"/>
    </marker>
  </defs>
  <rect width="720" height="400" rx="8" fill="#0a1128"/>

  <!-- Git -->
  <rect x="30" y="24" width="300" height="88" rx="6" fill="none" stroke="#ff2a6d" stroke-width="1.5"/>
  <text x="50" y="50" class="h g">Git</text>
  <text x="50" y="74" class="m">bootstrap/*.sops.yaml</text>
  <text x="50" y="96">secret zero, criptografado em repouso</text>

  <!-- 1Password -->
  <rect x="390" y="24" width="300" height="88" rx="6" fill="none" stroke="#70789a" stroke-width="1.5"/>
  <text x="410" y="50" class="h">1Password</text>
  <text x="410" y="74">cofres: o da plataforma e um por time</text>
  <text x="410" y="96">os secrets de verdade ficam aqui</text>

  <!-- cluster -->
  <rect x="20" y="140" width="680" height="240" rx="6" fill="none" stroke="#05d9e8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="40" y="166" class="c">cluster</text>

  <path d="M180 112v62" stroke="#ff2a6d" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="192" y="130" class="m">sops decrypt | kubectl apply</text>

  <rect x="30" y="178" width="300" height="62" rx="6" fill="none" stroke="#ff2a6d" stroke-width="1.5"/>
  <text x="50" y="204" class="h">Secret</text>
  <text x="50" y="226">token da service account do 1Password</text>

  <rect x="390" y="178" width="300" height="62" rx="6" fill="none" stroke="#05d9e8" stroke-width="1.5"/>
  <text x="410" y="204" class="h c">External Secrets Operator</text>
  <text x="410" y="226">lê os cofres usando o token</text>

  <path d="M330 209h56" stroke="#05d9e8" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M540 112v62" stroke="#05d9e8" stroke-width="1.5" marker-end="url(#a)"/>

  <path d="M540 240v52" stroke="#05d9e8" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="390" y="296" width="300" height="62" rx="6" fill="none" stroke="#05d9e8" stroke-width="1.5"/>
  <text x="410" y="322" class="h">Secrets do Kubernetes</text>
  <text x="410" y="344">sincronizados com o 1Password</text>

  <path d="M390 327h-56" stroke="#05d9e8" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="30" y="296" width="300" height="62" rx="6" fill="none" stroke="#70789a" stroke-width="1.5"/>
  <text x="50" y="322" class="h">aplicações</text>
  <text x="50" y="344">montam como qualquer Secret</text>
</svg>
