order: 3
repo: https://github.com/pedroshaina/cv-ssh
website: https://cv-ssh.pedromartins.dev.br
en:
  title: cv-ssh
  summary: >-
    My CV as a terminal app served over SSH. Connect with any SSH client and browse it as a TUI:
    no account, no key, no password. The SSH server is the app, with no shell behind it.
pt-br:
  title: cv-ssh
  summary: >-
    Meu currículo em um app de terminal servido via SSH. É só conectar com qualquer cliente SSH
    e navegar pela TUI: sem criar conta, sem autenticação necessária. O próprio servidor SSH é o app, sem
    nenhum shell por trás.
